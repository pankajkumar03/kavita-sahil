# Netlify: build settings are read from here, so importing the repo needs no manual setup.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Hashed JS/CSS never change — cache them for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Photos and the song: cache for a day (they may be replaced)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/music/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
